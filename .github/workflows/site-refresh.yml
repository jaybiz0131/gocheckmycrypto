# Site refresh: keeps the data desks current between daily briefs.
#
# The Whale Watch board and every Market Pulse dashboard are regenerated at Netlify BUILD
# time (see netlify.toml), so refreshing the site is just pinging the build hook. The two
# daily briefs already deploy (~07:55 and ~16:55 UTC, via their story push or hook ping);
# this one extra midday ping keeps the dashboards to roughly 4-5 hour freshness. Roughly
# 3 builds/day at ~3 minutes each is ~270 Netlify build minutes/month -- the free tier
# pools ~300 across ALL the team's sites, so the cadence is deliberately lean (owner's
# call, 2026-07-12). Add or remove cron lines to tune.
#
# No secrets beyond NETLIFY_BUILD_HOOK, no code runs here, and a missing hook is a
# documented skip, never a failure.
name: Site refresh (data desks)

on:
  schedule:
    # PROGRAM 4 (2026-09-16): the briefs this comment sat between are gone. T-1 left one
    # brief a day per desk, the evening Edition at 23:08 UTC, so from 00:00 to 23:08 this
    # noon refresh is the ONLY thing that moves the Board. It is one build a day and no
    # model run, and it stays for that reason.
    #
    # It retires in Sprint I with R-1, when the Worker serves the Board (L-1) and the
    # numbers stop needing a deploy to reach the page.
    - cron: "0 12 * * *"   # 12:00 UTC, the Board's only mid-day update until L-1
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -s -f -X POST -d '{}' "$HOOK" > /dev/null \
              && echo "::notice::Triggered a Netlify rebuild (Whale Watch + Market Pulse refresh)." \
              || echo "::warning::Build hook ping failed; the desks will refresh on the next scheduled build."
          else
            echo "::notice::NETLIFY_BUILD_HOOK not set; skipping (the daily brief and pushes still refresh the site)."
          fi
