# Crypto Cronkite news brief: the scheduled ingest -> AI processing -> review queue job.
#
# Runs aggregate -> editor -> verifier -> writer -> digest twice a day (morning and US
# afternoon) and uploads the review queue as a workflow artifact for the human
# editor-in-chief to approve.
#
# FAIL-CLOSED and it NEVER PUBLISHES. It runs run.py (Stages 1-5) only; publish.py (Stage 6)
# is a separate, deliberate, human-approved step and is intentionally not invoked here. If any
# stage errors, run.py exits non-zero and this job goes red (flagging a human); nothing is
# pushed anywhere.
#
# The pipeline needs ANTHROPIC_API_KEY (repo secret) for the editor/verifier/writer calls, and
# optionally CRYPTOPANIC_TOKEN / WHALE_ALERT_API_KEY / X_BEARER_TOKEN to widen sourcing. If the
# key is not configured yet, the job runs the offline canary as a wiring smoke test and stops
# (green) instead of failing daily.
name: Crypto Cronkite daily brief

on:
  schedule:
    # THREE-SLOT DAY (owner directive 2026-07-14, Eastern audience clock): the flagship
    # cadence. Later slots prefer updating/extending the day over repeating it (editor
    # prompt + deterministic dedup guard). Crons drift 1h later on Jack's clock when DST
    # ends Nov 1.
    # Odd minutes on purpose: GitHub's scheduler drifts worst on :00/:30 (observed slots
    # firing 3-7 hours late). The watcher's slot-recovery re-fires any slot that still
    # misses its deadline.
    - cron: "40 10 * * *"   # Morning Brief slot, 10:40 UTC = 6:40am Eastern
    - cron: "8 17 * * *"    # Midday Update slot, 17:08 UTC = 1:08pm Eastern
    - cron: "8 23 * * *"    # Evening Wrap slot, 23:08 UTC = 7:08pm Eastern
    # RETRY TICKS (ported from the sports desk 2026-08-31: crypto was the only desk
    # of the three without them, and in the Aug 26-31 window its slot crons fired
    # hours late or never while the siblings' retries kept them at 3/3). Each retry
    # is inside its slot's edition window and COST-NEUTRAL: the slot guard below
    # stands the run down before any model call when the slot's edition already
    # exists, so a retry only spends when the primary was skipped or failed. Keep
    # these in sync with CRON_SLOT in wrap.py. The evening slot has no retry: its
    # window ends at midnight, and the watcher's recovery (which now follows a
    # missed evening slot across midnight to 05:00) covers it.
    - cron: "55 10 * * *"   # Morning retry
    - cron: "23 17 * * *"   # Midday retry
    - cron: "25 11 * * *"   # Second morning retry: the morning cycle must be live before 12:00 UTC
  # AN EXTERNAL TRIGGER NEEDS TO NAME THE SLOT (2026-09-04). GitHub's scheduler has been
  # delivering this workflow's crons 1.5 to 4 hours late every day this week, so the fix
  # is a trigger that does not depend on it. A dispatch carries no schedule, so without
  # these inputs the run falls back to the wall clock, which is the ambiguity the slot
  # guard was just rewritten to remove. Firing with slot="afternoon-brief" makes the
  # caller's intent explicit and both the guard and wrap.py honour it.
  workflow_dispatch:
    inputs:
      slot:
        description: "Edition slug this run is for (morning-brief, afternoon-brief, evening-brief). Empty resolves from the clock."
        type: string
        default: ""
      breaking:
        description: "Breaking-news run (skips the slot guard)"
        type: boolean
        default: false
  # the breaking-news watcher (watcher.yml) calls this workflow with breaking=true
  workflow_call:
    inputs:
      breaking:
        type: boolean
        default: false
      # the edition slug a slot-recovery fire is for; wrap.py regenerates exactly this
      # slot instead of resolving one from the wall clock (empty = resolve normally)
      slot:
        type: string
        default: ""

# PUBLISH LOCK (directive item 9): one publish at a time per repo. The lock lives at the
# JOB level below, not up here, and that placement is load-bearing: GitHub IGNORES a
# reusable workflow's workflow-level concurrency when it is invoked via workflow_call, so
# a workflow-level group here never covered the watcher's breaking runs; they were in NO
# group at all and raced scheduled briefs (every push failure 2026-07-25..29 had a
# concurrent run of the other workflow pushing within the same minutes). Job-level
# concurrency applies in every trigger mode: schedule, dispatch, and workflow_call.
permissions:
  contents: write   # autopilot commits auto-approved VERIFIED stories into site/content
  issues: write     # deploy_check opens a flag issue if a push never deploys

jobs:
  brief:
    # THE actual publish lock (see the header comment): one brief job at a time, whether
    # this workflow was scheduled, dispatched, or called by the watcher. GitHub queues at
    # most one pending job per group; a third overlapping run is superseded, and the
    # watcher's slot recovery re-fires any slot that loses its turn.
    concurrency:
      group: crypto-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # CHECK OUT THE BRANCH TIP, NOT THE TRIGGER SHA (duplicate root cause 2026-08-25).
      # Bare checkout pins github.sha, the commit the run was SCHEDULED against. The
      # publish jobs share a concurrency group so runs queue, and a queued run can start
      # an hour after it was triggered: it then judges its duplicate guards against an
      # hour-stale corpus, cannot see the story a sibling run just published, and the
      # push step's rebase-retry lands the second copy without re-running any guard.
      # That is how one CIA-Moscow story published twice 83 minutes apart. ref: main
      # makes every run judge against the corpus as of run START, which with queueing
      # is complete.
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The pipeline itself is stdlib-only; Pillow is the one optional extra, used by
      # site_build's per-article OG cards. Netlify installs it the same way, so installing
      # it here keeps autopilot's validation build identical to the deploy (and quiet).
      # Fail-open: no Pillow just means cards are skipped, exactly like production.
      - name: Optional deps (OG card rendering, matches the Netlify build)
        run: pip install --quiet Pillow || true

      - name: Offline canary (hard gate, blocks a mis-wired pipeline)
        # QUIET CANARY (family audit 2026-09-02). The canary deliberately exercises
        # the fail-closed paths: publish refusing a replay-mode approval, the contract
        # ladder climbing on 'nonsense'/'x'/'y', the editor missing 'ranked'. Each of
        # those prints a ::error:: or ::warning:: line, and as workflow commands they
        # became ANNOTATIONS on every run: a green run carried "publish: approval
        # file is mode=replay ... Refusing to publish" and "editor: model output was
        # not parseable JSON" at the top of its summary, which is how a real failure
        # learned to hide in plain sight. stop-commands turns the canary's output
        # into plain log lines for the duration of the step; a canary FAILURE still
        # fails the step (non-zero exit) exactly as before.
        run: |
          token="canary-$RANDOM$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          rc=0
          python3 verify_pipeline.py canary || rc=$?
          echo "::$token::"
          if [ "$rc" != "0" ]; then
            echo "::error::Offline canary FAILED (exit $rc): the pipeline is mis-wired; read the step log above. Nothing runs live until it passes."
          fi
          exit $rc

      - name: Detect whether the API key is configured
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; ran the offline canary only. Add the secret to enable the live daily brief."
          fi

      # SLOT GUARD (ported from the sports desk 2026-08-31): on schedule ticks
      # (primary or retry), if this slot's edition is already on disk the day is
      # served and the run stands down before any model call. Manual dispatch always
      # runs; breaking runs always run (they regenerate the slot edition on purpose);
      # watcher recovery fires only when the edition is missing, so it always passes.
      # Adapted for this desk's drift reality: the cron names the slot (wrap.py's
      # CRON_SLOT, retries included) and a pre-05:00 evening fire belongs to the
      # PREVIOUS day, exactly as wrap.py dates it; the clock is only the fallback.
      - name: Slot guard (a retry tick stands down when the slot is already served)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
          SLOT_CRON: ${{ github.event.schedule }}
          SLOT_NAME: ${{ inputs.slot }}
        run: |
          python3 - <<'PYEOF'
          import datetime, os, subprocess
          serve = "true"
          if os.environ.get("EVENT") == "schedule" and os.environ.get("BREAKING") != "1":
              now = datetime.datetime.now(datetime.timezone.utc)
              cron_slug = {"40 10 * * *": "morning-brief", "55 10 * * *": "morning-brief",
                           "25 11 * * *": "morning-brief", "8 17 * * *": "afternoon-brief",
                           "23 17 * * *": "afternoon-brief", "8 23 * * *": "evening-brief"}
              # SLOT_NAME outranks both, the same precedence wrap.py uses: a caller that
              # names the slot knows something the cron and the clock do not, and an
              # external trigger is exactly that caller.
              named = (os.environ.get("SLOT_NAME") or "").strip()
              slug = named or cron_slug.get((os.environ.get("SLOT_CRON") or "").strip())
              day = now.date()
              if slug is None:
                  slug = ("morning-brief" if now.hour < 14 else
                          "afternoon-brief" if now.hour < 20 else "evening-brief")
              elif slug == "evening-brief" and now.hour < 5:
                  day = day - datetime.timedelta(days=1)
              # ASK ORIGIN, NOT THE CHECKOUT (2026-09-04). The guard read the working
              # tree, and a run's tree is only as fresh as the moment it was created. A
              # workflow_dispatch pins its SHA at dispatch time, and the publish lock can
              # hold it behind an in-flight run for many minutes, so a queued run checked
              # out a tree from BEFORE the slot was served and served it a second time.
              # Observed live on this chassis: a dispatch pinned to dba1eb2 ran after the
              # scheduled run had already pushed the afternoon edition, saw no edition in
              # its own tree, and went on to draft. Same class as the P2 duplicate race,
              # where the corpus guard compares against a checkout that has moved on.
              #
              # One network call before any model call. Fail-open on purpose: if origin
              # cannot be reached the checkout is still a better answer than refusing to
              # publish, which is the rule for every gate on this desk.
              rel = os.path.join("site", "content", f"{day.isoformat()}-{slug}.json")
              def _served_on_main(path):
                  try:
                      subprocess.run(["git", "fetch", "--depth=1", "origin", "main"],
                                     check=True, capture_output=True, timeout=90)
                      r = subprocess.run(["git", "cat-file", "-e", f"FETCH_HEAD:{path}"],
                                         capture_output=True, timeout=30)
                      return r.returncode == 0
                  except Exception as e:
                      print(f"::warning::Slot guard could not read origin/main ({e}); "
                            f"falling back to this run's checkout, which may be stale.")
                      return None
              served = _served_on_main(rel)
              where = "origin/main"
              if served is None:
                  served, where = os.path.exists(rel), "this run's checkout"
              if served:
                  serve = "false"
                  print(f"::notice::Slot guard: {slug} is already published for "
                        f"{day.isoformat()} (per {where}); standing down before any "
                        f"model call (retry ticks are free when the primary served "
                        f"the slot).")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"serve={serve}\n")
          PYEOF

      # BOARDS BEFORE THE PIPELINE READS THEM (owner audit 2026-08-25). This refresh used
      # to run AFTER run.py, so every stage that consumes the boards consumed the copy
      # committed in the repo, and pulse/flows are deliberately never committed: on this
      # day that copy was 27 days old, saying BTC $63,653 and Fear and Greed 29 while the
      # live market was $79,185 and 74. writer.py hands those numbers to the drafting
      # model as desk_boards, and the editorial log shows a Solana story killed for citing
      # "current SOL pricing of $73.25" when SOL was $98.11: the desk was arguing with
      # itself about a month-old number. Keyless, fail-open, seconds to run.
      - name: Refresh the market boards BEFORE the pipeline reads them
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        run: |
          python3 whale_flows.py || true
          python3 market_pulse.py || true

      - name: Run the daily brief (live; Stages 1-5 only, never publishes)
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 run.py --mode live

      # FULL AUTO RELEASE (Jack's standing instruction, 2026-07-11): the adversarial verifier
      # is the gate. VERIFIED stories auto-publish; NEEDS-HUMAN-REVIEW stays queued for a
      # human take; REJECT never ships. The push below auto-deploys via Netlify.
      - name: Autopilot publish of VERIFIED stories
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          # breaking runs enforce the additive two-source gate (single-source holds unless
          # headline-labeled unconfirmed); scheduled runs pass '0'
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
        run: python3 autopilot.py

      # The Chart Master reads the same boards the deploy will publish: refresh the two
      # data desks first (fail-open, like the Netlify build does), then generate the read.
      # The read is committed (Netlify does not regenerate it at build time); flows/pulse
      # are NOT committed here because every Netlify build refreshes them itself.
      - name: Refresh the boards and generate the Chart Master's read
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 chartmaster.py

      # THE DAILY EDITION (Jack's media-outlet doctrine, 2026-07-14): The Morning Brief /
      # The Closing Wrap, the guaranteed twice-daily synthesis over the desk's own
      # published stories + boards (runs after the board refresh above so The Tape section
      # reads fresh data). Runs even when no new story cleared the gates (the whole point:
      # never a zero-content slot). Fail-open for the brief: an edition failure warns
      # loudly but never blocks story publishing.
      - name: The Daily Edition (Morning / Afternoon / Evening Brief + The Bottom Line)
        id: wrap
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # a breaking run REGENERATES the current slot's edition so The Bottom Line
          # includes the story that just broke (owner directive 2026-07-15)
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
          # which slot this run IS, from the cron that fired (2026-08-04): wall-clock
          # buckets plus scheduler drift made runs steal each other's slots, and the
          # desk never once published all three in a day
          SLOT_CRON: ${{ github.event.schedule }}
          # the slot a recovery fire is FOR (outranks cron and clock in wrap.py)
          SLOT_NAME: ${{ inputs.slot }}
        run: |
          # FAIL-LOUD (owner ruling 2026-08-17, fix 2): the exit code is captured and
          # enforced by the LAST step of the job, after stories publish. An edition
          # failure no longer hides inside a green run, and it still cannot block
          # story publishing. wrap.py exits 0 on publish AND on honest silence.
          rc=0
          python3 wrap.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then
            echo "::error::daily edition failed its gates (exit $rc); stories publish normally and the final step will mark this run FAILED"
          fi

      # THE OTHER HALF OF THE EDITION FLAG (family audit 2026-09-02): the step below
      # opens "Edition stage failed" issues, the watcher opens "Missed edition", and
      # edition_check opens "Edition gap"; nothing closed them, so the tracker held
      # one stale issue per failed slot (25 on the crypto desk). A served slot
      # closes them all with a note naming this run. Observability only.
      - name: Clear the edition flags once an edition is served
        if: always() && steps.wrap.outputs.rc == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/close_edition_flags.py || true

      # KNOWN-EVENT COVERAGE CHECK (audit item 5, 2026-07-28): the desk knew the Zcash
      # Ironwood activation date nine days early, published it in passing, and still had no
      # story on the day. This reads data/week_calendar.json every run and flags any due
      # event with no coverage dated on or after it. Advisory: warns for the editor, never
      # blocks a publish (|| true keeps a coverage judgment out of the failure path).
      # Federal rulemaking onto the calendar BEFORE the news carries it. regwatch.py can
      # only see measures the desk already covered, so the desk's regulatory awareness was
      # entirely downstream of feeds. Keyless, advisory, and read by calendar_check only;
      # the reader-facing Week Ahead still runs off the curated file. See fedreg.py.
      - name: Federal Register sweep (rulemaking onto the calendar)
        if: steps.key.outputs.have_key == 'true'
        run: python3 fedreg.py || true

      - name: Known-event coverage check (calendar vs what the desk published)
        if: steps.key.outputs.have_key == 'true'
        run: python3 calendar_check.py || true

      # The exploit half of the same question. Nobody schedules a hack, so the curated
      # calendar cannot cover this beat; an independent ledger can. Keyless, advisory,
      # never fails the run. See hackwatch.py.
      - name: Exploit coverage check (DefiLlama hacks ledger vs what the desk published)
        if: steps.key.outputs.have_key == 'true'
        run: python3 hackwatch.py || true

      # EDITION GAP CHECK. The edition step above is `wrap.py || echo warning`, which is the
      # right fail-open posture and also why a broken edition is silent: the job stays green
      # and the warning scrolls past. It went unnoticed for three days, with the July 28
      # Evening Brief still holding the homepage hero on July 31. This counts the gap so the
      # next one is a flag rather than a discovery. Advisory, like the checks above it.
      - name: Daily edition gap check (is the guaranteed edition actually running?)
        if: steps.key.outputs.have_key == 'true'
        env:
          # breach files one deduplicated flag issue (owner ruling 2026-08-03: a warning
          # inside a green run is a named anti-pattern; fail-open gains escalation)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: edgap
        run: |
          breach=0
          python3 edition_check.py || breach=$?
          echo "breach=$breach" >> "$GITHUB_OUTPUT"

      # DUPLICATE BACKLOG. The guard stops a duplicate at publish; this asks what is already
      # on the site. It replaced a scan that only compared stories published on the SAME DAY
      # and therefore reported the CFTC/Kalshi cluster as five articles when it was six.
      # KILL-STREAK ALARM (owner ruling 2026-08-03, N=3): three consecutive approver
      # kills on one development with no publish files one digest issue quoting every
      # kill verbatim, so a human can judge legitimate-versus-theater. The writer
      # carries prior objections into the next draft automatically; this is the bell.
      - name: Kill-streak check (is the desk abandoning a development it owns?)
        if: steps.key.outputs.have_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 kill_streak.py || true

      - name: Duplicate audit (cross-day, whole corpus)
        if: steps.key.outputs.have_key == 'true'
        run: python3 dupe_audit.py || true

      # P2. Near-identical headlines that nobody declared an update. Advisory and
      # exits 0: a publish_sweep drop deletes a VERIFIED story, so this reports
      # until the separator has a record behind it. See twin_audit.py's header for
      # the two candidate rules already rejected on live data.
      - name: Twin audit (same event published twice?)
        if: always()
        run: python3 twin_audit.py --quiet || true

      # IS EVERY SOURCE ACTUALLY SERVING? Advisory, never a gate (source_health.py
      # always exits 0). The scoreboard ran baseball-only for days and three working
      # intake lanes were retired as dead, both because a permanent source failure and
      # a quiet night produced identical output. This annotates only REGRESSIONS
      # against the committed baseline, so a standing problem stays quiet and a feed
      # that changed state overnight is the thing that speaks.
      - name: Source health (did any feed change state since the last run?)
        if: always()
        run: python3 source_health.py --quiet || true

      # ESCALATE THE COVERAGE GAP (owner directive 2026-07-31). calendar_check knew the
      # FOMC decision was uncovered on the day it happened and said so in a ::warning::
      # nobody reads, so the desk missed the week's biggest event twice over: once to the
      # preview-suppression bug, and once to an alarm with no bell on it.
      #
      # STILL NOT A GATE. A coverage gap is a judgment call, so this never blocks a publish
      # and never fails the run; it raises a flag a human can act on or dismiss.
      #
      # The anti-noise rules are the whole design, because this runs three times a day:
      #   - ONE issue, reopened state tracked by a fingerprint of the uncovered set;
      #   - identical set on a later run -> silence, no comment, no email;
      #   - changed set -> the body is rewritten and ONE comment posts;
      #   - no gaps -> the issue closes itself.
      # An event the desk deliberately never covers ages out of the calendar window on its
      # own, so the flag clears without anyone having to argue with it.
      - name: Flag an uncovered known event
        if: steps.key.outputs.have_key == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Calendar: a known event has no coverage"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}

          def api(url, data=None, method=None):
              req = urllib.request.Request(
                  url, data=json.dumps(data).encode() if data is not None else None,
                  headers=hdrs, method=method)
              return json.load(urllib.request.urlopen(req))

          # Both coverage checks feed ONE flag. Two issues for "the desk missed something"
          # would halve the attention each gets, which is the opposite of the point.
          gaps, read_any = [], False
          for report in ("out/calendar_gaps.json", "out/hack_gaps.json"):
              try:
                  gaps += json.load(open(report, encoding="utf-8"))["uncovered"]
                  read_any = True
              except Exception:
                  pass
          if not read_any:
              print("no coverage gap report to act on"); raise SystemExit

          issues = api(f"https://api.github.com/repos/{repo}/issues?state=open&labels=calendar")
          existing = next((i for i in issues if i["title"] == title), None)

          if not gaps:
              if existing:
                  api(existing["comments_url"], {"body": f"Every event now due has coverage. "
                                                         f"Closing. ({os.environ['RUN_URL']})"})
                  api(f"https://api.github.com/repos/{repo}/issues/{existing['number']}",
                      {"state": "closed", "state_reason": "completed"}, method="PATCH")
                  print(f"gap cleared; closed #{existing['number']}")
              else:
                  print("no uncovered events")
              raise SystemExit

          fp = hashlib.sha1("|".join(sorted(
              f"{e.get('date')}::{e.get('title')}" for e in gaps)).encode()).hexdigest()[:12]
          lines = "\n".join(
              f"- **{e.get('date')}** ({e.get('kind')}) {e.get('title')}\n"
              f"  - nothing published matching `{e.get('match')}`\n"
              f"  - source: {e.get('source', 'n/a')}" for e in gaps)
          body = (f"{len(gaps)} event(s) the desk should have covered and did not.\n\n"
                  f"{lines}\n\n"
                  "This is advisory: it does not block publishing, and it is fine to close "
                  "if the desk decided the event was not worth covering. It reopens if a "
                  "different event goes uncovered.\n\n"
                  f"Last checked: {os.environ['RUN_URL']}\n\n<!-- gapfp:" + fp + " -->")

          if not existing:
              api(f"https://api.github.com/repos/{repo}/issues",
                  {"title": title, "body": body, "labels": ["calendar"]}, method="POST")
              print(f"opened a calendar flag for {len(gaps)} event(s)")
          elif f"<!-- gapfp:{fp} -->" in (existing.get("body") or ""):
              # Same events as last run. Say nothing: this fires three times a day and a
              # repeated comment would train everyone to ignore the flag.
              print(f"same {len(gaps)} event(s) already flagged on #{existing['number']}; quiet")
          else:
              api(f"https://api.github.com/repos/{repo}/issues/{existing['number']}",
                  {"body": body}, method="PATCH")
              api(existing["comments_url"],
                  {"body": f"The uncovered set changed:\n\n{lines}\n\n{os.environ['RUN_URL']}"})
              print(f"updated #{existing['number']}: the uncovered set changed")
          PYEOF

      # THE WEEK AHEAD (audit item 2, 2026-07-27): Monday's calendar-driven forward story,
      # rendered deterministically from data/week_calendar.json. No model, no forecasts by
      # construction; non-Mondays and already-published weeks exit clean.
      - name: Week Ahead story (Mondays, from the curated calendar)
        if: steps.key.outputs.have_key == 'true'
        run: python3 week_ahead.py

      # CROSS-SURFACE CONSISTENCY GATE (audit item 1, 2026-07-27): the homepage once
      # showed a lead story reporting weekly ETF INFLOWS beside a Chart Master blurb
      # saying "outflows persist". Deterministic tripwire: if two co-rendering surfaces
      # assert opposite directions on the same metric (ETF flows, BTC price, dominance,
      # whale flows), this run publishes NOTHING and goes red for a human. Runs after the
      # boards/edition are generated so it checks exactly what would ship.
      - name: Cross-surface consistency gate (no contradictions on one viewport)
        if: steps.key.outputs.have_key == 'true'
        env:
          # for the pre-existing-contradiction flag issue; a conflict between two
          # already-live surfaces warns + files an issue instead of killing the run
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 consistency_gate.py

      - name: Commit and push published content (deploys the site)
        id: publish
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        run: |
          git config user.name "Jack Berno"
          git config user.email "297991518+jaybiz0131@users.noreply.github.com"
          # SHIP THE BOARDS THE PIPELINE JUST READ (owner report 2026-08-28). This staged
          # chartmaster.json but NOT pulse.json or flows.json, so the numbers refreshed at
          # the top of this run lived only in the runner: the deployed site kept whatever
          # was last committed, which was 29 July. That is why the Chart Master's prose
          # (committed, fresh) sat next to an RSI from a month earlier (not committed), and
          # why a story quoting BTC at $79,291 rendered beside a board reading $63,654.
          # Netlify re-runs both refreshers at deploy, but its build IP is rate-limited, so
          # the committed snapshot is the fallback that actually reaches readers: it has to
          # be current.
          git add site/content site/data/chartmaster.json site/data/pulse.json \
                  site/data/flows.json editorial-log.json regwatch.json \
                  site/data/source_health.json
          if git diff --cached --quiet; then
            echo "::notice::No new stories to publish (nothing VERIFIED or all already live)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "brief: VERIFIED stories + Chart Master read $(date -u +%Y-%m-%dT%H:%MZ)"
            # LAST-LINE DUPLICATE SWEEP (2026-08-25). The guards upstream judge the
            # corpus in this run's checkout; this judges the corpus as it exists NOW,
            # after fetching whatever landed while the run worked. A zero-novelty twin
            # of an already-published story is removed from the commit before it ships,
            # loudly. Hygiene never blocks the news: a sweep crash publishes unswept.
            git fetch origin main || true
            python3 publish_sweep.py || echo "::warning::publish_sweep skipped (crashed)"
            if [ -f out/sweep_dropped ]; then
              git add -A site/content
              git commit --amend --no-edit --allow-empty
              rm -f out/sweep_dropped
            fi
            # RACE-SAFE PUSH (run 30162489012 postmortem): main can move while a brief runs
            # (the concurrency group only serializes THIS workflow; merges and other pushes
            # still land mid-run). A bare push then gets rejected and the run's verified
            # stories are lost. Content commits are additive new files, so rebase-and-retry
            # is conflict-free in practice; a real conflict still fails loudly (fail-closed).
            ok=false
            for i in 1 2 3; do
              if git push; then ok=true; break; fi
              echo "::warning::push rejected (attempt $i): main moved mid-run; rebasing and retrying"
              # --autostash is load-bearing, not tidiness (run 30178... postmortem): the
              # boards step rewrites site/data/pulse.json and flows.json, and the commit
              # above stages neither, so the tree is ALWAYS dirty here. Plain
              # "git pull --rebase" refuses to run with unstaged changes and exits 128,
              # which killed the step on the first rejection and lost the run's stories.
              #
              # The rebase itself then conflicts, which the original comment here said it
              # would not: site/content/ is additive, but editorial-log.json, regwatch.json
              # and chartmaster.json are rewritten by EVERY run, so two overlapping runs
              # always collide on them. merge_state.py resolves exactly those three and
              # refuses anything else, so a real conflict still fails loudly.
              if ! git pull --rebase --autostash origin main; then
                if python3 merge_state.py; then
                  git add editorial-log.json regwatch.json site/data/chartmaster.json \
                          site/data/pulse.json site/data/flows.json
                  GIT_EDITOR=true git rebase --continue \
                    || { echo "::error::rebase could not continue after auto-resolve"; \
                         git rebase --abort || true; exit 1; }
                else
                  echo "::error::rebase hit a conflict outside the known generated files"
                  git rebase --abort || true
                  exit 1
                fi
              fi
              # a sibling landed mid-run and the rebase just merged it: sweep again
              # against the now-complete corpus before retrying the push
              python3 publish_sweep.py || true
              if [ -f out/sweep_dropped ]; then
                git add -A site/content
                git commit --amend --no-edit --allow-empty
                rm -f out/sweep_dropped
              fi
            done
            [ "$ok" = true ] || { echo "::error::push failed after 3 rebase-and-retry attempts"; exit 1; }
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The Publicist moved to its own workflow (publicist.yml, 14:30 UTC) so posts land
      # in LinkedIn's US morning instead of the middle of the night.

      # Deploy-status verification (directive item 10): a pushed commit that never
      # deployed is a story nobody sees. Probes the live CDN for every page this run
      # published; failure opens a flag issue and turns the run red.
      - name: Verify the deploy actually served
        if: steps.publish.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 deploy_check.py

      # A dead slot must PING, not sit quiet (2026-07-15: two contract failures went
      # unnoticed until the owner asked where the stories were). One open issue per
      # failure title; the watcher's slot recovery independently retries the slot.
      - name: Flag the failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Desk run failed: pipeline error (see run log)"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&labels=pipeline", headers=hdrs)
          open_flag = next((i for i in json.load(urllib.request.urlopen(req))
                            if i["title"] == title), None)
          if open_flag:
              # Comment rather than go silent. Deduping the ISSUE is right; deduping the
              # ALARM is not. Run 30577704932 failed while the flag from 30397726694 was
              # still open, so the second failure printed "not duplicating" and told
              # nobody anything, and the two turned out to have different causes.
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{open_flag['number']}/comments",
                  data=json.dumps({"body": f"Failed again: {os.environ['RUN_URL']}"}).encode(),
                  headers=hdrs, method="POST")
              urllib.request.urlopen(req); print("flag issue already open; added a comment")
              raise SystemExit
          body = (f"A scheduled/breaking desk run failed: {os.environ['RUN_URL']}\n\n"
                  "The watcher's slot recovery will retry the slot automatically; this flag "
                  "exists so a repeating failure gets human eyes. Close after the next green run.")
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues",
              data=json.dumps({"title": title, "body": body, "labels": ["pipeline"]}).encode(),
              headers=hdrs, method="POST")
          urllib.request.urlopen(req); print("failure flag opened")
          PYEOF

      # The other half of the flag. Nothing ever closed these, so the first failure opened
      # an issue and every failure after it was silent until a human closed it by hand: a
      # one-shot alarm. A green run means the slot recovered, which is exactly the
      # condition the issue text already asked a human to close on.
      - name: Clear the failure flag on a green run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Desk run failed: pipeline error (see run log)"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&labels=pipeline", headers=hdrs)
          for i in json.load(urllib.request.urlopen(req)):
              if i["title"] != title:
                  continue
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{i['number']}/comments",
                  data=json.dumps({"body": f"Green run: {os.environ['RUN_URL']}. "
                                           "Closing; the flag re-opens if it fails again."}).encode(),
                  headers=hdrs, method="POST")
              urllib.request.urlopen(req)
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{i['number']}",
                  data=json.dumps({"state": "closed", "state_reason": "completed"}).encode(),
                  headers=hdrs, method="PATCH")
              urllib.request.urlopen(req); print(f"cleared flag #{i['number']}")
          PYEOF

      - name: Upload the review queue for human approval
        if: steps.key.outputs.have_key == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: crypto-review-queue
          path: |
            out/items.json
            out/review_queue/
            out/approval_template.json
            out/run_report.json
            out/wrap-status.json
            out/wrap-rejected.json
          if-no-files-found: warn

      # The Whale Watch board refreshes at Netlify BUILD time (see netlify.toml), so a
      # rebuild keeps it current without committing data. Runs even if the brief failed:
      # board freshness is independent of the news pipeline. SKIPPED when the brief just
      # pushed stories -- that push already triggered a build, and a second one would only
      # burn Netlify build minutes (the free tier pools ~300/month across all sites).
      # No hook secret -> documented skip.
      - name: Refresh the website (Netlify build hook -> data desk update)
        id: ping
        # RETRY GUARD ON THE PING (ported with the slot guard 2026-08-31): a retry
        # tick that stood down because its slot was already served must not buy a
        # paid build either. The guard already gates the model calls and the
        # publish; this line closes the last leak. A run that failed before the
        # guard ran (serve empty) also skips the ping.
        if: always() && steps.guard.outputs.serve == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
        run: |
          pinged=false
          if [ "$PUSHED" = "true" ]; then
            echo "::notice::Stories were pushed; that deploy already refreshes the data desks. Skipping the hook ping."
          elif [ -n "$HOOK" ]; then
            if curl -s -f -X POST -d '{}' "$HOOK" > /dev/null; then
              echo "::notice::Triggered a Netlify rebuild (data desk refresh)."
              pinged=true
            else
              echo "::warning::Netlify build hook ping failed; the desks will refresh on the next deploy."
            fi
          else
            echo "::notice::NETLIFY_BUILD_HOOK not set; the board refreshes only on pushes. Add the secret to enable the daily refresh."
          fi
          echo "pinged=$pinged" >> "$GITHUB_OUTPUT"

      # OPS LEDGER (owner ruling 2026-08-17, audit fix 5b/5d): one queryable outcome row
      # per brief execution, appended as a comment on the month's "Ops ledger" issue.
      # Answers "how many builds, and why" as a lookup instead of a log dig, and counts
      # watcher-embedded executions (wf field carries the calling workflow's name).
      # Observability only: a ledger failure never fails the run.
      - name: Ops ledger (append this execution's outcome)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WF: ${{ github.workflow }}
          EV: ${{ github.event_name }}
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
          CRON: ${{ github.event.schedule }}
          SERVE: ${{ steps.guard.outputs.serve }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          PINGED: ${{ steps.ping.outputs.pinged }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ops_ledger.py || echo "::warning::ops ledger append failed (observability only, run unaffected)"

      # FAIL-LOUD EDITION GATE (owner-approved Design 2, 2026-08-17): runs dead last
      # so stories, the deploy probe, artifacts, the hook ping, and the ops ledger all
      # complete before the run is failed. If wrap.py exited non-zero, this opens a
      # slot-named issue and marks the run failed. Honest silence (wrap exit 0 without
      # publishing, e.g. the slot is already served) stays green. The ordering is the
      # requirement: story publishing completes even when the edition fails and the
      # run goes red.
      - name: Fail the run if the edition stage failed
        if: always() && steps.wrap.outputs.rc != '' && steps.wrap.outputs.rc != '0'
        uses: actions/github-script@v9
        env:
          # the slot this run WAS, resolved the same way wrap.py resolves it
          # (2026-08-31): wall-clock getUTCHours() mislabeled drifted runs, so issue
          # #67 said "morning 2026-08-31" for the Aug-30 EVENING cron's run
          SLOT_CRON: ${{ github.event.schedule }}
          SLOT_NAME: ${{ inputs.slot }}
        with:
          script: |
            const CRON_SLOT = {
              "40 10 * * *": "morning", "55 10 * * *": "morning", "25 11 * * *": "morning",
              "8 17 * * *": "afternoon", "23 17 * * *": "afternoon",
              "8 23 * * *": "evening"
            };
            const NAME_SLOT = {
              "morning": "morning", "morning-brief": "morning",
              "midday": "afternoon", "afternoon-brief": "afternoon",
              "evening": "evening", "evening-brief": "evening", "closing": "evening"
            };
            const cron = (process.env.SLOT_CRON || "").trim();
            const slotName = (process.env.SLOT_NAME || "").trim().toLowerCase();
            let slot = NAME_SLOT[slotName] || CRON_SLOT[cron];
            const now = new Date();
            // a fire earlier in the day than its cron's hour wrapped past midnight:
            // the slot belongs to its own (previous) day, exactly as wrap.py dates it
            if (CRON_SLOT[cron]) {
              const cronHour = parseInt(cron.split(/\s+/)[1], 10);
              if (now.getUTCHours() < cronHour) now.setUTCDate(now.getUTCDate() - 1);
            } else if (slot === "evening" && now.getUTCHours() < 5) {
              now.setUTCDate(now.getUTCDate() - 1);
            }
            if (!slot) {
              const h = now.getUTCHours();
              slot = h < 14 ? "morning" : h < 20 ? "afternoon" : "evening";
            }
            const date = now.toISOString().slice(0, 10);
            const title = `Edition stage failed: ${slot} ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `wrap.py exited ${{ steps.wrap.outputs.rc }} in this run: ${runUrl}`,
              "",
              "Stories published normally; only the edition stage failed. Slot recovery",
              "re-fires the slot on its own; this issue exists so a repeating edition",
              "failure gets human eyes. Close after the next green slot."
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Failed again: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
            core.setFailed(`Edition stage failed (${slot} ${date}); stories were unaffected.`);

      # EDITION-GAP GATE (owner directive 2026-08-25): an abstained edition is as loud
      # as a failed one. Crypto went dark for 42 hours behind green runs because wrap
      # correctly abstained on zero stories every slot and only the gap counter noticed.
      # Runs dead last so stories, the deploy probe, artifacts, the ping and the ledger
      # all complete first; the gap issue itself is filed by edition_check.
      - name: Fail the run if the edition gap breached
        if: always() && steps.edgap.outputs.breach != '' && steps.edgap.outputs.breach != '0'
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed("Edition gap over threshold; stories were unaffected. See the open 'Edition gap' issue.");
