# The breaking-news watcher (directive item 2, 2026-07-14): every 30 minutes, NO model
# calls, ~$0. Plain thresholds: >5% hourly move on a major (CoinGecko keyless) or a fresh
# story carried by 4+ independent sources (the desk's own RSS aggregation). On trigger it
# calls the full brief workflow with breaking=true, which adds the two-source publish gate.
# Thresholds are configurable without code changes via repo Variables:
#   WATCH_MOVE_PCT (default 5.0), WATCH_MIN_SOURCES (4), WATCH_FRESH_MIN (90),
#   WATCH_COOLDOWN_MIN (120: quiet while coverage is already fresh).
# Serialization against scheduled publishes comes from the JOB-level crypto-publish
# concurrency group inside the called workflow's brief job (directive item 9). It must
# stay at job level there: GitHub ignores a reusable workflow's workflow-level
# concurrency under workflow_call, which is how breaking runs raced scheduled briefs
# through 2026-07-29.
name: Breaking-news watcher

on:
  schedule:
    # Four registrations per hour, not a 15-minute cadence promise. Measured 2026-07-19
    # ..08-02: GitHub's scheduler fired only 96 of ~687 scheduled ticks (median gap 174
    # minutes, p90 8.4 HOURS), so breaking-news latency was hours, not the 30 minutes
    # the charter assumes. Each cron line is its own registration and ticks get dropped
    # per-registration, so denser odd-minute entries raise the effective fire rate at
    # zero cost (public repo: Actions minutes are free; the watch job is no-model, ~$0).
    # If latency still matters after this, the real fix is an external cron hitting
    # workflow_dispatch with a PAT: Jack's call, needs a secret only he can mint.
    # PROGRAM 4, T-1 (2026-09-16): CAGED, AND THE WORKER DRIVES IT. Four registrations
    # an hour around the clock is what produced 39 brief runs on 15 Sep. The Worker now
    # dispatches this workflow on the half hour during US hours (T-2), which is both
    # less often and only when a reader is awake to read the result.
    #
    # The cron stays as a thin safety net at :17 past, so the desk is not blind to a
    # major event if the Worker is down. The cage lives in watcher.py, not here: an
    # earning category, five sources, two runs a day, price triggers off. A tick that
    # does not clear the cage costs nothing - no model call is made.
    # - cron: "2,17,32,47 * * * *"   # REPLACED T-1
    - cron: "17 12-23 * * *"         # hourly, US hours only, as the Worker's backstop
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      trigger: ${{ steps.w.outputs.trigger }}
      breaking: ${{ steps.w.outputs.breaking }}
      # the edition slug a slot-recovery fire is for; empty on market/news triggers
      slot: ${{ steps.w.outputs.slot }}
      reason: ${{ steps.w.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Threshold check (no model, no spend)
        id: w
        env:
          WATCH_MOVE_PCT: ${{ vars.WATCH_MOVE_PCT }}
          WATCH_MIN_SOURCES: ${{ vars.WATCH_MIN_SOURCES }}
          WATCH_FRESH_MIN: ${{ vars.WATCH_FRESH_MIN }}
          WATCH_COOLDOWN_MIN: ${{ vars.WATCH_COOLDOWN_MIN }}
        run: python3 watcher.py

  # market triggers run with the additive breaking gate; SLOT RECOVERY runs as a normal
  # scheduled-equivalent pipeline (breaking=false)
  fire:
    needs: watch
    if: needs.watch.outputs.trigger == 'true'
    uses: ./.github/workflows/crypto-news-brief.yml
    with:
      breaking: ${{ needs.watch.outputs.breaking == 'true' }}
      slot: ${{ needs.watch.outputs.slot }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
